name: sinhvien_app
description: "Student learning planner built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.2
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.1.2
  open_filex: ^4.7.0
  pdf: ^3.11.3
  flutter_local_notifications: ^19.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quiz/quiz_manifest.json
    - assets/quiz/banks/
